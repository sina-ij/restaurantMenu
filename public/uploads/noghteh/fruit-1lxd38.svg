<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#154331"/>
      <stop offset="1" stop-color="#0b2c1d"/>
    </linearGradient>
    <pattern id="dots" x="27" y="27" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="3.2" fill="#f5edc9" opacity="0.14"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>
  <rect width="900" height="900" fill="url(#dots)"/>

  <!-- لوزیِ کم‌رنگ، اشاره به نشانِ برند -->
  <rect x="215" y="215" width="470" height="470" rx="70"
        transform="rotate(45 450 450)"
        fill="none" stroke="#cfb16b" stroke-width="3" opacity="0.16"/>

  <rect width="900" height="900" fill="url(#vignette)"/>

  <g transform="translate(450 450) scale(1.7625) translate(-180 -206)"
     fill="none" stroke="#f5edc9" stroke-width="9.65"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 140c-48-20-88 18-84 68 4 56 46 90 84 76 38 14 80-20 84-76 4-50-36-88-84-68z"/>
    <path d="M180 140V98"/>
    <path d="M180 112c26-30 58-26 58-26 0 30-26 40-58 26z"/>
    <path d="M64 300c60 34 172 34 232 0"/>
  </g>
</svg>
