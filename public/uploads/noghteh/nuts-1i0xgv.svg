     stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 200c0 90 40 128 104 128s104-38 104-128z"/>
    <path d="M62 200h236"/>
    <path d="M124 200c-16-30 4-58 32-58s44 28 30 58"/>
